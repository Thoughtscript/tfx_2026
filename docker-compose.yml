services:
  beam:
    build:
      context: .
      dockerfile: services/beam/Dockerfile
    image: tfx-2026-beam:local
    platform: linux/amd64
    container_name: beam
    network_mode: "service:flink-taskmanager"
    environment:
      TF_SERVING_URL: ${TF_SERVING_URL:-http://tensorflow-serving:8501/v1/models/example:predict}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - tensorflow-serving
      - postgres
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('localhost', 50000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # The external SDK worker reports its control endpoint as localhost.
    # Sharing the TaskManager network namespace keeps that endpoint reachable.

  flink-jobmanager:
    build:
      context: .
      dockerfile: services/flink-jobmanager/Dockerfile
    image: flink:2.2.1-scala_2.12-java17
    platform: linux/amd64
    command: jobmanager
    networks:
      - tfx-network
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  flink-taskmanager:
    build:
      context: .
      dockerfile: services/flink-taskmanager/Dockerfile
    image: tfx-2026-flink-taskmanager:2.2.1
    platform: linux/amd64
    command: taskmanager
    networks:
      - tfx-network
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.host: flink-taskmanager
        classloader.parent-first-patterns.additional: org.apache.beam.vendor.grpc.v1p69p0.

  tensorflow-serving:
    build:
      context: .
      dockerfile: services/tensorflow-serving/Dockerfile
    image: tfx-2026-tensorflow-serving:local
    platform: linux/amd64
    networks:
      - tfx-network
    ports:
      - "8500:8500"
      - "8501:8501"
    environment:
      TF_CPP_MIN_LOG_LEVEL: "0"
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "</dev/tcp/127.0.0.1/8501"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    image: tfx-2026-postgres:local
    platform: linux/amd64
    networks:
      - tfx-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: services/airflow-init/Dockerfile
    image: tfx-2026-airflow-init:local
    platform: linux/amd64
    networks:
      - tfx-network
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["/bin/bash", "/opt/airflow/init.sh"]
    environment: &airflow-environment
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-secret-key}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: services/airflow-webserver/Dockerfile
    image: tfx-2026-airflow-webserver:local
    platform: linux/amd64
    networks:
      - tfx-network
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow-environment
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: services/airflow-scheduler/Dockerfile
    image: tfx-2026-airflow-scheduler:local
    platform: linux/amd64
    networks:
      - tfx-network
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    environment: *airflow-environment
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      beam:
        condition: service_healthy
      tensorflow-serving:
        condition: service_started
      flink-jobmanager:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  tfx-network:
    name: tfx-network
    driver: bridge
